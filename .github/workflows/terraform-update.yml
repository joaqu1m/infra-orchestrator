name: Run Terraform

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '!terraform/bootstrap**'

jobs:
  terraform:
    name: Deploy Terraform Job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Debug secrets parcialmente
        run: |
          echo "AWS_ACCESS_KEY_ID primeiros 4 chars: ${AWS_ACCESS_KEY_ID:0:4}***"
          echo "AWS_SECRET_ACCESS_KEY últimos 4 chars: ***${AWS_SECRET_ACCESS_KEY: -4}"
          echo "AWS_SESSION_TOKEN existe: ${{ secrets.AWS_SESSION_TOKEN != '' }}"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: "us-east-1"

      - name: Initialize Terraform
        run: terraform init

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve
